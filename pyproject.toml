[project]
name = "tiptree-x-analytics"
version = "0.0.1"
description = "X post analytics for Tiptree Systems"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyarrow>=16",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools]
packages = ["src"]
